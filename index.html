<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>格口管理</title>
    <style>
      :root {
        --bg: #f4f5f3;
        --surface: #ffffff;
        --surface-2: #eceee9;
        --ink: #191c1a;
        --ink-2: #5a605b;
        --line: #d8dcd4;
        --accent: #b3540a;
        --accent-ink: #ffffff;
        --ok: #1c6b3c;
        --ok-bg: #e2f0e6;
        --warn: #8a5a00;
        --warn-bg: #f7ecd2;
        --err: #a3241c;
        --err-bg: #f9e3e1;
        --banner-bg: #191c1a;
        --banner-ink: #f5f2ec;
        --banner-sub: #b9beb4;
        --mono: "SF Mono", ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101211;
          --surface: #1a1d1b;
          --surface-2: #242825;
          --ink: #eceee9;
          --ink-2: #9aa198;
          --line: #333733;
          --accent: #e07b2a;
          --accent-ink: #16130f;
          --ok: #6fce8f;
          --ok-bg: #1d2f23;
          --warn: #e3b34e;
          --warn-bg: #33290f;
          --err: #f08a80;
          --err-bg: #3a1e1b;
          --banner-bg: #ece9e2;
          --banner-ink: #191c1a;
          --banner-sub: #5a605b;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        max-width: 560px;
        margin: 0 auto;
        padding: 14px 14px 40px;
      }

      /* ---------- Current chute banner ---------- */
      .banner {
        background: var(--banner-bg);
        color: var(--banner-ink);
        border-radius: 10px;
        padding: 18px 20px 16px;
        transition: box-shadow 0.15s ease;
      }
      .banner.flash-ok { box-shadow: 0 0 0 4px var(--ok); }
      .banner.flash-err { box-shadow: 0 0 0 4px var(--err); }
      .banner .label {
        font-size: 13px;
        letter-spacing: 0.14em;
        color: var(--banner-sub);
        margin: 0 0 2px;
      }
      .banner .chute-row {
        display: flex;
        align-items: baseline;
        gap: 14px;
        flex-wrap: wrap;
      }
      .banner .chute-num {
        font-family: var(--mono);
        font-size: 76px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0.02em;
      }
      .banner .chute-none {
        font-size: 30px;
        font-weight: 700;
        line-height: 1.25;
      }
      .banner .meta {
        font-size: 14px;
        color: var(--banner-sub);
        font-family: var(--mono);
      }
      .banner .meta b {
        color: var(--banner-ink);
        font-weight: 600;
      }

      /* ---------- Scan input ---------- */
      .scanbox {
        margin-top: 12px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
      }
      .scanbox label {
        display: block;
        font-size: 13px;
        color: var(--ink-2);
        margin-bottom: 8px;
      }
      .scan-row { display: flex; gap: 8px; }
      .scan-row input {
        flex: 1 1 auto;
        min-width: 0;
        font-family: var(--mono);
        font-size: 17px;
        padding: 12px;
        border: 1.5px solid var(--ink-2);
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink);
      }
      .scan-row input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
      }
      .scan-row button {
        flex: 0 0 auto;
        font-size: 16px;
        font-weight: 600;
        padding: 0 18px;
        border: none;
        border-radius: 8px;
        background: var(--accent);
        color: var(--accent-ink);
        cursor: pointer;
      }
      .scan-row button:active { opacity: 0.85; }

      /* ---------- Toast ---------- */
      .toast {
        margin-top: 12px;
        border-radius: 8px;
        padding: 11px 14px;
        font-size: 15px;
        display: none;
      }
      .toast.show { display: block; }
      .toast.ok { background: var(--ok-bg); color: var(--ok); }
      .toast.warn { background: var(--warn-bg); color: var(--warn); }
      .toast.err { background: var(--err-bg); color: var(--err); }
      .toast .mono { font-family: var(--mono); word-break: break-all; }

      /* ---------- Item list ---------- */
      .list-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin: 22px 2px 8px;
      }
      .list-head h2 {
        font-size: 16px;
        margin: 0;
        font-weight: 700;
      }
      .list-head .count {
        font-size: 13px;
        color: var(--ink-2);
        font-family: var(--mono);
      }
      .items {
        list-style: none;
        margin: 0;
        padding: 0;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
      }
      .items li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 12px;
        border-bottom: 1px solid var(--line);
      }
      .items li:last-child { border-bottom: none; }
      .items .seq {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--ink-2);
        flex: 0 0 30px;
        text-align: right;
      }
      .items .code {
        font-family: var(--mono);
        font-size: 15px;
        flex: 1 1 auto;
        min-width: 0;
        word-break: break-all;
      }
      .items .time {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--ink-2);
        flex: 0 0 auto;
      }
      .items .del {
        flex: 0 0 auto;
        width: 34px;
        height: 34px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface-2);
        color: var(--err);
        font-size: 17px;
        line-height: 1;
        cursor: pointer;
      }
      .items .del:active { opacity: 0.7; }
      .empty {
        background: var(--surface);
        border: 1px dashed var(--line);
        border-radius: 10px;
        padding: 22px 14px;
        text-align: center;
        color: var(--ink-2);
        font-size: 14px;
      }

      /* ---------- Summary & export ---------- */
      .summary {
        margin-top: 22px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px;
      }
      .summary h2 { font-size: 16px; margin: 0 0 10px; }
      .summary table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      .summary th, .summary td {
        text-align: left;
        padding: 7px 6px;
        border-bottom: 1px solid var(--line);
      }
      .summary th { color: var(--ink-2); font-weight: 600; font-size: 13px; }
      .summary td.num, .summary th.num { text-align: right; font-family: var(--mono); }
      .summary tr:last-child td { border-bottom: none; }
      .summary .none { color: var(--ink-2); font-size: 14px; }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      .actions button {
        flex: 1 1 140px;
        font-size: 15px;
        font-weight: 600;
        padding: 12px 10px;
        border-radius: 8px;
        cursor: pointer;
        border: 1px solid var(--line);
        background: var(--surface-2);
        color: var(--ink);
      }
      .actions button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }
      .actions button.danger-armed {
        background: var(--err);
        border-color: var(--err);
        color: #fff;
      }
      .actions button:disabled { opacity: 0.45; cursor: default; }
      .hint {
        margin-top: 14px;
        font-size: 13px;
        color: var(--ink-2);
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <!-- Current chute -->
      <section class="banner" id="banner" aria-live="polite">
        <p class="label">当前格口</p>
        <div class="chute-row">
          <span class="chute-none" id="chuteDisplay">未选择</span>
        </div>
        <p class="meta" id="chuteMeta">先扫格口二维码，之后扫到的包裹都进这个格口</p>
      </section>

      <!-- Scanner input: PDA wedge scanners type here and send Enter -->
      <section class="scanbox">
        <label for="scanInput">扫码输入（打开页面即可直接扫，扫完自动录入）</label>
        <form class="scan-row" id="scanForm" autocomplete="off">
          <input
            id="scanInput"
            type="text"
            inputmode="text"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            placeholder="等待扫码…"
          />
          <button type="submit">录入</button>
        </form>
      </section>

      <div class="toast" id="toast" role="status"></div>

      <!-- Items in current chute -->
      <div class="list-head">
        <h2 id="listTitle">当前格口包裹</h2>
        <span class="count" id="listCount"></span>
      </div>
      <ul class="items" id="itemList"></ul>
      <div class="empty" id="emptyState">暂无记录</div>

      <!-- Summary + export -->
      <section class="summary">
        <h2>全部格口汇总</h2>
        <div id="summaryBody"><p class="none">还没有扫入任何包裹。</p></div>
        <div class="actions">
          <button type="button" class="primary" id="exportBtn" disabled>导出 CSV</button>
          <button type="button" id="clearBtn" disabled>清空全部</button>
        </div>
        <p class="hint">
          格口二维码内容形如 {"sorterCode":"MZD-EPT01","chuteCode":"001"}，扫到即切换格口；
          其他条码一律记入当前格口。同一格口内重复条码自动忽略。记录只保存在本页面内，
          换班或结束作业前请先导出 CSV。
        </p>
      </section>
    </div>

    <script>
      (function () {
        "use strict";

        // State: current chute + records grouped by chute.
        // chutes: { "001": { sorter: "MZD-EPT01", items: [ {code, time} ] } }
        var currentChute = null;
        var currentSorter = null;
        var chutes = {};
        var chuteOrder = [];

        var banner = document.getElementById("banner");
        var chuteDisplay = document.getElementById("chuteDisplay");
        var chuteMeta = document.getElementById("chuteMeta");
        var form = document.getElementById("scanForm");
        var input = document.getElementById("scanInput");
        var toast = document.getElementById("toast");
        var listTitle = document.getElementById("listTitle");
        var listCount = document.getElementById("listCount");
        var itemList = document.getElementById("itemList");
        var emptyState = document.getElementById("emptyState");
        var summaryBody = document.getElementById("summaryBody");
        var exportBtn = document.getElementById("exportBtn");
        var clearBtn = document.getElementById("clearBtn");

        var toastTimer = null;
        function showToast(kind, html, sticky) {
          toast.className = "toast show " + kind;
          toast.innerHTML = html;
          if (toastTimer) clearTimeout(toastTimer);
          if (!sticky) {
            toastTimer = setTimeout(function () {
              toast.className = "toast";
            }, 3500);
          }
        }

        function flash(kind) {
          banner.classList.remove("flash-ok", "flash-err");
          // Force reflow so repeated flashes retrigger.
          void banner.offsetWidth;
          banner.classList.add(kind === "ok" ? "flash-ok" : "flash-err");
          setTimeout(function () {
            banner.classList.remove("flash-ok", "flash-err");
          }, 450);
        }

        // Short beep via WebAudio; silently no-ops until the browser
        // allows audio (first tap/keypress creates the context).
        var audioCtx = null;
        function beep(freq) {
          try {
            if (!audioCtx) {
              var AC = window.AudioContext || window.webkitAudioContext;
              if (!AC) return;
              audioCtx = new AC();
            }
            if (audioCtx.state === "suspended") audioCtx.resume();
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            osc.frequency.value = freq;
            gain.gain.value = 0.08;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.09);
          } catch (e) {
            /* audio unavailable — visual feedback still applies */
          }
        }

        function fmtTime(d) {
          function p(n) { return (n < 10 ? "0" : "") + n; }
          return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
        }

        function totalItems() {
          var n = 0;
          for (var i = 0; i < chuteOrder.length; i++) n += chutes[chuteOrder[i]].items.length;
          return n;
        }

        function render() {
          // Banner
          if (currentChute) {
            chuteDisplay.textContent = currentChute;
            chuteDisplay.className = "chute-num";
            var cur = chutes[currentChute];
            chuteMeta.innerHTML =
              "分拣机 <b></b> · 本格口已扫 <b></b> 件";
            chuteMeta.querySelectorAll("b")[0].textContent = currentSorter || "—";
            chuteMeta.querySelectorAll("b")[1].textContent = cur ? cur.items.length : 0;
          } else {
            chuteDisplay.textContent = "未选择";
            chuteDisplay.className = "chute-none";
            chuteMeta.textContent = "先扫格口二维码，之后扫到的包裹都进这个格口";
          }

          // Item list for current chute
          itemList.innerHTML = "";
          var items = currentChute && chutes[currentChute] ? chutes[currentChute].items : [];
          listTitle.textContent = currentChute
            ? "格口 " + currentChute + " 的包裹"
            : "当前格口包裹";
          listCount.textContent = items.length ? items.length + " 件" : "";
          emptyState.style.display = items.length ? "none" : "block";
          emptyState.textContent = currentChute
            ? "格口 " + currentChute + " 还没有包裹，开始扫码即可录入"
            : "暂无记录";
          itemList.style.display = items.length ? "block" : "none";

          for (var i = items.length - 1; i >= 0; i--) {
            (function (item, seq) {
              var li = document.createElement("li");
              var seqEl = document.createElement("span");
              seqEl.className = "seq";
              seqEl.textContent = seq;
              var codeEl = document.createElement("span");
              codeEl.className = "code";
              codeEl.textContent = item.code;
              var timeEl = document.createElement("span");
              timeEl.className = "time";
              timeEl.textContent = item.time;
              var del = document.createElement("button");
              del.type = "button";
              del.className = "del";
              del.textContent = "×";
              del.setAttribute("aria-label", "删除条码 " + item.code);
              del.addEventListener("click", function () {
                removeItem(item.code);
              });
              li.appendChild(seqEl);
              li.appendChild(codeEl);
              li.appendChild(timeEl);
              li.appendChild(del);
              itemList.appendChild(li);
            })(items[i], i + 1);
          }

          // Summary
          if (chuteOrder.length === 0) {
            summaryBody.innerHTML = '<p class="none">还没有扫入任何包裹。</p>';
          } else {
            var table = document.createElement("table");
            var thead = document.createElement("thead");
            thead.innerHTML = "<tr><th>格口</th><th>分拣机</th><th class='num'>件数</th></tr>";
            table.appendChild(thead);
            var tbody = document.createElement("tbody");
            chuteOrder.forEach(function (code) {
              var tr = document.createElement("tr");
              var td1 = document.createElement("td");
              td1.textContent = code;
              var td2 = document.createElement("td");
              td2.textContent = chutes[code].sorter || "—";
              var td3 = document.createElement("td");
              td3.className = "num";
              td3.textContent = chutes[code].items.length;
              tr.appendChild(td1);
              tr.appendChild(td2);
              tr.appendChild(td3);
              tbody.appendChild(tr);
            });
            var trTotal = document.createElement("tr");
            var tdT1 = document.createElement("td");
            tdT1.textContent = "合计";
            var tdT2 = document.createElement("td");
            tdT2.textContent = chuteOrder.length + " 个格口";
            var tdT3 = document.createElement("td");
            tdT3.className = "num";
            tdT3.textContent = totalItems();
            trTotal.appendChild(tdT1);
            trTotal.appendChild(tdT2);
            trTotal.appendChild(tdT3);
            tbody.appendChild(trTotal);
            table.appendChild(tbody);
            summaryBody.innerHTML = "";
            summaryBody.appendChild(table);
          }

          var has = totalItems() > 0 || chuteOrder.length > 0;
          exportBtn.disabled = totalItems() === 0;
          clearBtn.disabled = !has;
        }

        function ensureChute(code, sorter) {
          if (!chutes[code]) {
            chutes[code] = { sorter: sorter || null, items: [] };
            chuteOrder.push(code);
          }
          if (sorter) chutes[code].sorter = sorter;
        }

        function removeItem(code) {
          if (!currentChute || !chutes[currentChute]) return;
          var items = chutes[currentChute].items;
          for (var i = 0; i < items.length; i++) {
            if (items[i].code === code) {
              items.splice(i, 1);
              break;
            }
          }
          showToast("ok", "已删除 <span class='mono'></span>");
          toast.querySelector(".mono").textContent = code;
          render();
          focusInput();
        }

        // Core scan handler: a chute QR is JSON carrying chuteCode;
        // anything else is a parcel barcode for the current chute.
        function handleScan(raw) {
          var value = (raw || "").trim();
          if (!value) return;

          var parsed = null;
          if (value.charAt(0) === "{") {
            try { parsed = JSON.parse(value); } catch (e) { parsed = null; }
          }

          if (parsed && parsed.chuteCode != null && String(parsed.chuteCode) !== "") {
            var code = String(parsed.chuteCode);
            var sorter = parsed.sorterCode != null ? String(parsed.sorterCode) : null;
            var switched = code !== currentChute;
            ensureChute(code, sorter);
            currentChute = code;
            if (sorter) currentSorter = sorter;
            render();
            flash("ok");
            beep(880);
            showToast(
              "ok",
              (switched ? "已切换到格口 <b>" : "已定位格口 <b>") +
                escapeHtml(code) + "</b>" +
                (sorter ? "（分拣机 " + escapeHtml(sorter) + "）" : "") +
                "，接下来扫的包裹都进这里"
            );
            return;
          }

          // Parcel barcode
          if (!currentChute) {
            flash("err");
            beep(220);
            showToast("err", "还没有选格口。请先扫格口二维码，再扫包裹条码。", true);
            return;
          }
          var items = chutes[currentChute].items;
          for (var i = 0; i < items.length; i++) {
            if (items[i].code === value) {
              flash("err");
              beep(220);
              showToast(
                "warn",
                "重复条码，已忽略：<span class='mono'></span>（格口 " + escapeHtml(currentChute) + " 已有此件）"
              );
              toast.querySelector(".mono").textContent = value;
              return;
            }
          }
          items.push({ code: value, time: fmtTime(new Date()) });
          render();
          flash("ok");
          beep(1320);
          showToast(
            "ok",
            "已记入格口 <b>" + escapeHtml(currentChute) + "</b>：<span class='mono'></span>"
          );
          toast.querySelector(".mono").textContent = value;
        }

        function escapeHtml(s) {
          return String(s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          var v = input.value;
          input.value = "";
          handleScan(v);
          focusInput();
        });

        // Keep the scanner focused: PDA wedge scanners type into the
        // focused field, so any tap returns focus to the input.
        function focusInput() {
          try { input.focus({ preventScroll: true }); } catch (e) { input.focus(); }
        }
        document.addEventListener("click", function (e) {
          if (e.target === input || e.target.closest("button") || e.target.closest("a")) return;
          focusInput();
        });
        input.addEventListener("blur", function () {
          setTimeout(function () {
            if (document.activeElement === document.body) focusInput();
          }, 120);
        });
        window.addEventListener("load", focusInput);

        // Export CSV (UTF-8 BOM so Excel opens it with Chinese intact)
        exportBtn.addEventListener("click", function () {
          var rows = [["格口号", "分拣机", "包裹条码", "扫描时间"]];
          chuteOrder.forEach(function (code) {
            chutes[code].items.forEach(function (item) {
              rows.push([code, chutes[code].sorter || "", item.code, item.time]);
            });
          });
          var csv = rows
            .map(function (r) {
              return r
                .map(function (cell) {
                  var s = String(cell);
                  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
                })
                .join(",");
            })
            .join("\r\n");
          var blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
          var url = URL.createObjectURL(blob);
          var d = new Date();
          function p(n) { return (n < 10 ? "0" : "") + n; }
          var a = document.createElement("a");
          a.href = url;
          a.download =
            "格口记录_" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) +
            "_" + p(d.getHours()) + p(d.getMinutes()) + ".csv";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
          showToast("ok", "已导出 CSV，共 " + totalItems() + " 条记录。");
          focusInput();
        });

        // Clear all: two-tap pattern (no blocking popups on PDA webviews)
        var clearArmed = false;
        var clearTimer = null;
        clearBtn.addEventListener("click", function () {
          if (!clearArmed) {
            clearArmed = true;
            clearBtn.textContent = "再点一次确认清空";
            clearBtn.classList.add("danger-armed");
            clearTimer = setTimeout(function () {
              clearArmed = false;
              clearBtn.textContent = "清空全部";
              clearBtn.classList.remove("danger-armed");
            }, 3000);
            return;
          }
          clearTimeout(clearTimer);
          clearArmed = false;
          clearBtn.textContent = "清空全部";
          clearBtn.classList.remove("danger-armed");
          chutes = {};
          chuteOrder = [];
          currentChute = null;
          currentSorter = null;
          render();
          showToast("ok", "已清空全部记录，可以重新开始扫码。");
          focusInput();
        });

        render();
      })();
    </script>
  </body>
</html>
